services:
  lead-api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["./data:/data"]
    restart: unless-stopped

  # Optional: n8n with the workflow in n8n/ (Workflows > Import from file)
  n8n:
    image: n8nio/n8n:latest   # workflow verified on n8n 1.123
    profiles: ["n8n"]
    ports: ["5678:5678"]
    environment:
      - LEAD_API_URL=http://lead-api:8000
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes: ["n8n_data:/home/node/.n8n", "./n8n:/workflows:ro"]
    depends_on: [lead-api]

volumes:
  n8n_data:
